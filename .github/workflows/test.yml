name: test
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    container: docker.io/library/node:22.23.4-alpine3.24
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env: { POSTGRES_USER: scrimbot, POSTGRES_PASSWORD: scrimbot, POSTGRES_DB: scrimbot }
        options: >-
          --health-cmd "pg_isready -U scrimbot" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://scrimbot:scrimbot@postgres:5432/scrimbot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apk add --no-cache python3 && npm install -g pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm py:setup
      - run: pnpm check
      - run: pnpm test:db
